<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Timeline Calculator</title>
		<link rel="stylesheet" href="/styles.css">
	</head>
	<body>
		<h1>Timeline Calculator</h1>
		<form>
			<select required name="qualification" id="qualification">
				<option value="unqualified">(unqualified)</option>
				<option value="approximately">About/Approximately</option>
				<option value="nearly">Almost/Nearly</option>
				<option value="more-than">Over/More than</option>
				<option value="exactly">Exactly</option>
			</select>
			<input required type="number" name="diff" id="diff" min="0" step="any">
			<select required name="step" id="step">
				<option value="years">years</option>
				<option value="months">months</option>
				<option value="days">days</option>
			</select>
			<select required name="dir" id="dir">
				<option value="before">before</option>
				<option value="after">after</option>
			</select>
			<input required type="number" name="year" id="year" placeholder="YYYY" step="any">
			<input required type="number" name="month" id="month" placeholder="MM" min="0" max="12">
			<input required type="number" name="day" id="day" placeholder="DD" min="0" max="31">
			<input type="submit" value="Submit" id="button">
		</form>
		<script src="script.js"></script>
	</body>
</html>
